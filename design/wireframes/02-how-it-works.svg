<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>02-how-it-works</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F4EF"/><defs><linearGradient id="hw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4E8C63"/><stop offset="100%" stop-color="#22503C"/></linearGradient></defs><rect x="0" y="0" width="390" height="844" rx="0" fill="url(#hw)"/><g id="status-bar"><text x="30" y="42" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0">9:41</text><rect x="300" y="32" width="18" height="11" rx="2" fill="#FFFFFF" fill-opacity="0.9"/><rect x="324" y="32" width="22" height="11" rx="3" fill="#FFFFFF" fill-opacity="0.35"/><rect x="325" y="33" width="16" height="9" rx="2" fill="#FFFFFF"/></g><text x="195" y="150" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">How it works</text><text x="195" y="182" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="16" font-weight="400" fill="#D3E4D8" text-anchor="middle" letter-spacing="0">Takes about a minute</text><g id="row-1"><rect x="24" y="278" width="74" height="38" rx="19" fill="#FFFFFF"/><text x="61" y="304" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="15" font-weight="500" fill="#22503C" text-anchor="middle" letter-spacing="0">Start</text><text x="116" y="305" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Pick how long you'll focus</text></g><g id="row-2"><rect x="30" y="352" width="52" height="52" rx="15" fill="#FFFFFF" fill-opacity="0.18"/><circle cx="56" cy="378" r="7" fill="#FFFFFF" fill-opacity="0.9"/><text x="116" y="383" font-family="Inter, SF Pro Text, system-ui, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="s