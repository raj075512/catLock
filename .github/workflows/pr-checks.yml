name: PR Checks

# Runs on every pull request that targets `dev` or `main`.
# Its main job is to guarantee the PR branch merges cleanly into its base
# (no conflicts), plus a build/test pass on macOS.
#
# `main` is included deliberately. It used to be `dev` only, which meant a
# branch merged straight into `main` was never built or tested — and that is
# exactly how a red build reached `main` once already.
on:
  pull_request:
    branches:
      - dev
      - main

# Cancel superseded runs for the same PR to save CI minutes.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflict-check:
    name: No conflicts with dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Full history is required so we can merge against the base branch.
          fetch-depth: 0

      - name: Attempt a dry-run merge into dev
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.ref }}"   # e.g. dev
          echo "Base branch: $BASE"

          git config user.name "ci-conflict-check"
          git config user.email "ci@catlock.local"

          # Make sure we have the latest base branch.
          git fetch origin "$BASE":"$BASE" 2>/dev/null || git fetch origin "$BASE"

          # Try a non-committing, no-fast-forward merge of the base into the PR head.
          # If this fails, there are conflicts that must be resolved before merging.
          if git merge --no-commit --no-ff "origin/$BASE"; then
            echo "✅ No merge conflicts with '$BASE'."
            git merge --abort 2>/dev/null || true
          else
            echo "❌ Merge conflicts detected with '$BASE'. Conflicting files:"
            git diff --name-only --diff-filter=U
            git merge --abort 2>/dev/null || true
            exit 1
          fi

  build-test:
    name: Build & Test (iOS)
    # macOS 26, because the app icon is an Icon Composer bundle that only
    # Xcode 26 can compile. The runner previously sat on macos-15 / Xcode 16.4
    # while development happened on 26.x, and that gap caused two separate red
    # builds in a day: an asset-catalog error, and a UI test that passed on
    # iOS 26 but failed on 18 because the two classify an accessibility element
    # differently. CI has to compile what the developer compiles.
    runs-on: macos-26
    # Don't bother building if the branch can't even merge cleanly.
    needs: conflict-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail

          echo "Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app

          # Newest installed, rather than whatever /Applications/Xcode.app
          # happens to point at.
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -switch "$LATEST/Contents/Developer"
          xcodebuild -version

          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/^Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR selected, but the Icon Composer app icon needs Xcode 26+. Move this job to a newer runner image."
            exit 1
          fi

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail

          # Chosen at run time rather than hardcoded. A pinned device name is
          # the same drift trap as a pinned Xcode — it silently disappears when
          # the image updates.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
import json, sys
runtimes = json.load(sys.stdin)["devices"]
names = [d["name"] for r in runtimes for d in runtimes[r] if d["name"].startswith("iPhone")]
print(sorted(names)[0] if names else "")
')

          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Testing on: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project goCat.xcodeproj \
            -scheme goCat \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }},OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # xcodebuild's console output names the failing test but not the
      # assertion, which made the last red build undiagnosable from the log
      # alone. The result bundle carries the failure message, the line number
      # and the UI-test screenshots.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
